{% extends "auth.html" %}
{% block title %}Sign in{% endblock %}
{% block card %}
<h1>Sign in</h1>
<p class="lede">Welcome back.</p>
<form class="card card-pad" method="post" action="/login">
  {% if let Some(error) = error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field"><label for="u">Username</label><input id="u" name="username" class="input" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
  <div class="field"><label for="p">Password</label><input id="p" name="password" class="input" type="password" autocomplete="current-password" required></div>
  <button class="btn primary block mt-20">Sign in</button>
</form>
<p class="auth-foot"><a href="/locked">Locked out?</a>{% if signup_open %} · New to fluxo? <a href="/signup">Create an account</a>{% endif %}</p>
{% endblock %}
