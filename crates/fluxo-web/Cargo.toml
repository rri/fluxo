[package]
name = "fluxo-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fluxo-core = { path = "../fluxo-core" }
fluxo-sim = { path = "../fluxo-sim" }
argon2 = "0.6.0"
askama = "0.14.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.21"
# Only for the session cookie's Max-Age (the cookie crate takes a time::Duration); already in the tree.
time = { version = "0.3.47", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
totp-rs = { version = "5.7.2", features = ["qr"] }
tracing = "0.1.44"
serde_json = "1.0.154"
jiff = "1.0.0"

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
