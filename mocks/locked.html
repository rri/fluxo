<h1>Get back in</h1>
<p class="lede">Ask a fluxo Administrator for a one-time recovery code, then enter it here.</p>
<form class="card card-pad" action="reset-password.html" method="get" data-next="reset-password.html">
  <div class="field"><label for="u">Username</label><input id="u" class="input" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
  <div class="field"><label for="c">Recovery code from an Administrator</label><input id="c" class="input mono" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required><span class="help">Codes work once and expire 24 hours after the Administrator creates them.</span></div>
  <button class="btn primary block" style="margin-top:20px">Continue</button>
</form>
<p class="auth-foot">Still have your own recovery codes? <a href="login-recovery.html">Use one</a> · <a href="login.html">Back to sign in</a></p>
