# Tests every push and pull request, and main every Monday (so new advisories
# show up between pushes). A push to main that passes is built as a static
# binary and deployed to fluxo.dev (see deploy/README.md).
#
# Third-party actions are pinned to commits; the comment names the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release's lints don't fail a deploy unannounced.
  RUST_VERSION: 1.98.1
  TARGET: x86_64-unknown-linux-musl

# A newer push to a pull request makes its older run pointless, so that one is cancelled. Runs on
# main each get their own group: none waits for or cancels another, and the deploy job's own
# check makes sure only the newest commit is deployed.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A failing run still compiled the dependencies; keep them.
          cache-on-failure: true
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked

  # Runs the production binary from the build job in Playwright's own image, which already has
  # the browsers and every library they need (installing those with apt took up to 13 minutes).
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Must match @playwright/test in tests/browser/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fluxo-${{ env.TARGET }}
          path: dist
      - name: Install test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Browser tests (Chromium with and without JavaScript, Firefox)
        working-directory: tests/browser
        run: |
          chmod +x ../../dist/fluxo
          FLUXO_BIN=../../dist/fluxo npx playwright test --reporter=github,list

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # Ignored, each with no fix fluxo can take yet. Any other advisory fails the build.
      # - RUSTSEC-2026-0459 (SQLite): fixed in libsqlite3-sys 0.39, which sqlx doesn't allow yet.
      # - RUSTSEC-2023-0071 (rsa): only in Cargo.lock through sqlx's MySQL driver; never compiled.
      # - RUSTSEC-2026-0374 (basic-toml unmaintained): askama reads its config with it at
      #   compile time; fluxo has no askama config. No askama release has dropped it yet.
      - name: Rust advisories
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0459
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0374

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # The musl packages are cached: refreshing apt's package lists alone can take a minute.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/musl-debs
          key: musl-debs-${{ runner.os }}-ubuntu-24.04-v1
      - name: Install musl
        run: |
          if ! ls ~/musl-debs/*.deb >/dev/null 2>&1; then
            sudo apt-get update
            mkdir -p ~/musl-debs
            (cd ~/musl-debs && apt-get download musl musl-dev musl-tools)
          fi
          sudo dpkg -i ~/musl-debs/*.deb
      - name: Build the static binary
        env:
          FLUXO_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target "$TARGET" -p fluxo
      - name: Check that it's static and runs
        run: |
          bin=target/$TARGET/release/fluxo
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked'
          "$bin" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluxo-${{ env.TARGET }}
          path: target/${{ env.TARGET }}/release/fluxo
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: [rust, browser, audit, build]
    # Pushes and manual runs only: the weekly run checks, it doesn't deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://fluxo.dev
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 100.82.93.4
    steps:
      - name: Still the newest commit on main
        id: newest
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $head; its own run deploys it."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.newest.outputs.deploy
        with:
          name: fluxo-${{ env.TARGET }}
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        if: steps.newest.outputs.deploy
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Install on the server
        if: steps.newest.outputs.deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          sha=$(sha256sum fluxo | cut -d' ' -f1)
          # Compressed: the link to the server may go through a slow Tailscale relay.
          ssh -C -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 "deploy@$DEPLOY_HOST" "$sha $GITHUB_SHA" < fluxo
      - name: Check https://fluxo.dev
        if: steps.newest.outputs.deploy
        run: curl -fsS --retry 5 --retry-all-errors https://fluxo.dev/api/health
